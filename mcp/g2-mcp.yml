generated: '2026-08-29'
method: searched
source: https://documentation.g2.com/docs/g2-mcp-server
provider: G2
providerId: g2
name: G2 MCP Server
description: >-
  G2's first-party remote MCP server. Exposes G2 buyer intent data, competitive
  intelligence, the product/category catalog and review analytics to MCP clients over
  OAuth 2.0. Read-only across the catalog and intent surfaces; research boards are the
  only writable resource.
status: published
deployment:
  mode: remote
  endpoint: https://mcp.g2.com/mcp
  auth: oauth
  verified: probed
  probe:
    method: POST
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    accept: application/json, text/event-stream
    http_status: 401
    checked: '2026-08-29'
    note: >-
      Anonymous tools/list returns 401, which confirms a live MCP endpoint whose schema is
      auth-gated. The tool list below is therefore taken verbatim from G2's own published
      "Supported MCP tools" table; per-tool inputSchema requires authenticated introspection.
  note: >-
    Remote only. G2 ships no stdio/npx package; the documented client examples (FastMCP for
    Python, the MCP TypeScript SDK) connect to the hosted endpoint over OAuth.
authentication:
  type: oauth2
  flow: authorization_code_pkce
  dynamic_client_registration: false
  registration: https://my.g2.com/developers
  authorization_endpoint: https://www.g2.com/oauth/authorize
  token_endpoint: https://www.g2.com/oauth/token
  introspection_endpoint: https://www.g2.com/oauth/introspect
  token_type: Bearer
  scopes:
    - openid
    - profile
    - products.read
    - products.reviews.read
    - vendors.read
    - buyer_intent.read
    - research_boards.read
    - research_boards.write
  notes:
    - G2's OAuth server does not support Dynamic Client Registration; pre-register a client_id/client_secret in the G2 Developer Dashboard.
    - The authorization callback returns `code` without `state`; MCP SDK examples that require `state` must be adjusted.
    - The MCP server validates tokens via G2's introspection endpoint, which may require cross-application token introspection to be enabled on your OAuth app.
rate_limits:
  note: >-
    The MCP server calls the underlying G2 API and inherits its limit of 100 requests per
    second per source IP (Cloudflare), with a 60-second block on exhaustion.
  source: https://documentation.g2.com/docs/g2-mcp-server
tools:
