  - name: list_categories
    description: Browse G2 categories
  - name: show_category
    description: Retrieve category details
  - name: list_standard_product_reviews
    description: Retrieve product reviews
  - name: list_market_intelligence_product_reviews
    description: Retrieve reviews with B2B firmographic data
  - name: list_vendors
    description: Browse vendors
  - name: show_vendor
    description: Retrieve vendor details
  - name: browse_buyer_intent
    description: Query buyer intent signals
  - name: browse_product_buyer_intent
    description: Retrieve buyer intent for a single product
  - name: browse_competitive_intelligence
    description: Analyze competitor evaluation activity
  - name: show_buyer_intent_dashboard
    description: Display the buyer intent dashboard
  - name: list_research_boards
    description: List research boards
  - name: show_research_board
    description: Display a research board
  - name: create_research_board
    description: Create a research board
  - name: update_research_board
    description: Update a research board
  - name: delete_research_board
    description: Delete a research board
  - name: list_research_board_products
    description: List products on a research board
  - name: add_products_to_research_board
    description: Add products to a research board
  - name: remove_products_from_research_board
    description: Remove products from a research board
tool_count: 21
partners:
  note: G2 also brokers MCP access through partner platforms; these are not separate endpoints.
  platforms:
    - HubSpot (Breeze Agents)
    - Gong (AI workflows)
    - AirOps (Playbooks)
    - Profound (Agents / Ask Profound)
    - Claude (connector directory)
    - ChatGPT (Apps)
entitlements: >-
  Access requires an active G2 subscription; buyer intent and market intelligence data
  require additional G2 entitlements.
