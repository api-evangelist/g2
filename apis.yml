- aid: g2:g2-data-solutions-api
  name: G2 Data Solutions API
  description: The G2 Data Solutions API returns enriched G2 review data with flat attribute structures,
    intended for investors, private equity and analytics teams that need product momentum, comparison
    and customer-satisfaction signal in a denormalised shape rather than as a JSON:API relationship graph.
    It is published as a separate OpenAPI document from the main G2 v2 API and is gated behind the G2
    Data Solutions add-on.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
