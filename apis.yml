apis:
- aid: g2:g2-mcp-server
  name: G2 MCP Server
  description: G2's first-party remote Model Context Protocol server. It exposes 21 tools covering buyer
    intent signals, competitive intelligence, the product and category catalog, vendor records, review
    analytics and research-board curation to any MCP-compatible client over OAuth 2.0 with PKCE. It is
    a hosted endpoint, not a locally installed package, and it calls the underlying G2 v2 API so it inherits
    the same 100 requests-per-second limit and the same subscription entitlements.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://mcp.g2.com/mcp
  humanURL: https://documentation.g2.com/docs/g2-mcp-server
  tags:
  - MCP
  - Agents
  - Buyer Intent
  - Software Discovery
