note: >-
  Three real documents are served, all on www.g2.com: an OpenID Connect discovery document
  (also mirrored at the RFC 8414 oauth-authorization-server path) and a ChatGPT plugin
  manifest. The API host data.g2.com, the docs host documentation.g2.com and the MCP host
  mcp.g2.com serve nothing at /.well-known/*. No security.txt is served on any host, so no
  SecurityTxt pointer is emitted. All 404 bodies were HTML/plain-text "Not Found" shells,
  not documents.
hosts:
