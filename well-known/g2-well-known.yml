note: 'Three real documents are served, all on www.g2.com: an OpenID Connect discovery document (also
  mirrored at the RFC 8414 oauth-authorization-server path) and a ChatGPT plugin manifest. The API host
  data.g2.com, the docs host documentation.g2.com and the MCP host mcp.g2.com serve nothing at /.well-known/*.
  No security.txt is served on any host, so no SecurityTxt pointer is emitted. All 404 bodies were HTML/plain-text
  "Not Found" shells, not documents.


  MCP-host OAuth discovery added 2026-09-19 (roadmap#321/#337): the harvest visits a provider''s primary
  hosts, and RFC 9728 protected-resource metadata lives on the MCP host, so these documents existed and
  were invisible to the scorer. Fetched live and validated on `resource`/`issuer`; one negative control
  per host.'
